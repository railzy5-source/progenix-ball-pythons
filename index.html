    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              emerald: {
                950: '#022c22',
              },
              slate: {
                850: '#151f32', // Custom deep slate
                950: '#020617', // Darker base
              }
            },
            fontFamily: {
              sans: ['"DM Sans"', 'sans-serif'],
              display: ['Syne', 'sans-serif'],
            },
            animation: {
                'fade-in': 'fadeIn 0.5s ease-out',
                'stagger-in': 'staggerIn 0.5s ease-out forwards',
            },
            keyframes: {
                fadeIn: {
                    '0%': { opacity: '0', transform: 'translateY(10px)' },
                    '100%': { opacity: '1', transform: 'translateY(0)' },
                },
                staggerIn: {
                    '0%': { opacity: '0', transform: 'translateY(20px)' },
                    '100%': { opacity: '1', transform: 'translateY(0)' },
                }
            },
            screens: {
                'print': {'raw': 'print'},
            }
          },
        },
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap');
      
      /* Smooth rendering */
      * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      
      /* Display headings use Syne */
      h1, h2, h3, .font-display { font-family: 'Syne', sans-serif; }
      
      /* Refined transitions */
      .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both; }
      
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(30, 41, 59, 0.4); /* Slate 800 with opacity */
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .glass-card {
        background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      }

      @media print {
        body * {
          visibility: hidden;
        }
        
        /* Whitelist specific print containers */
        #print-bulk, #print-cage-single, #print-cage-single *,
        #print-transfer, #print-transfer *,
        #print-care, #print-care *,
        #print-coa, #print-coa * {
          visibility: visible;
        }

        /* Container Overrides to force display */
        #print-bulk, #print-cage-single, #print-transfer, #print-care, #print-coa {
          position: fixed;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
          background: white;
          color: black;
          z-index: 9999;
        }

        /* Flex layouts */
        #print-bulk, #print-cage-single, #print-coa {
          display: flex !important;
          align-items: center;
          justify-content: center;
        }

        /* Block layouts */
        #print-transfer, #print-care {
          display: block !important;
        }
        
        #print-care {
            padding: 20px;
        }
      }
    </style>
